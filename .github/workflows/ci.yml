name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-tests:
    name: 后端测试 (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 运行测试 + 覆盖率
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test_pm.db"
          SECRET_KEY: "ci-secret-key"
          ENVIRONMENT: "test"
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          REDIS_URL: "redis://localhost:6379/15"
        run: |
          pytest --cov=app --cov-report=term-missing -q

  frontend-build:
    name: 前端构建 (vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 安装依赖并构建
        run: |
          npm ci || npm install
          npm run build

  deploy-staging:
    name: 部署 Staging
    needs: [backend-tests, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 部署提示
        run: echo "在 main 分支通过 CI 后自动部署 staging（由 deploy_paramiko.py 执行，密钥通过 Secrets 注入）"
      # 实际部署步骤示例（需配置 AIPM_PASS / 服务器 Secrets）：
      # - name: 推送部署
      #   env:
      #     AIPM_PASS: ${{ secrets.AIPM_PASS }}
      #   run: python AI-PM-Installer/deploy_paramiko.py push
